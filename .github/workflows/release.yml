name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    name: Release validation / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    env:
      BLUE_SEC_CACHE: ${{ github.workspace }}/.ci-state/cache
      BLUE_SEC_CONFIG: ${{ github.workspace }}/.ci-state/config
      BLUE_SEC_DATA: ${{ github.workspace }}/.ci-state/data
      CODEX_HOME: ${{ github.workspace }}/.ci-state/codex-home
      PYTHONUTF8: "1"
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Validate release source
        run: python scripts/validate.py --offline

  platform-contract:
    name: Release platform / ${{ matrix.platform }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        platform: [codex, claude, gemini, grok, opencode, openclaw, hermes, trae, trae-cn]
    env:
      BLUE_SEC_BIN: ${{ github.workspace }}/.platform-state/bin
      BLUE_SEC_CACHE: ${{ github.workspace }}/.platform-state/cache
      BLUE_SEC_CONFIG: ${{ github.workspace }}/.platform-state/config
      BLUE_SEC_DATA: ${{ github.workspace }}/.platform-state/data
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Verify install, upgrade, Doctor, and rollback contracts
        shell: bash
        env:
          HOME: ${{ github.workspace }}/.platform-state/home
        run: |
          python scripts/install.py --platform "${{ matrix.platform }}"
          python scripts/install.py --platform "${{ matrix.platform }}"
          python scripts/doctor.py --platform "${{ matrix.platform }}" --json > doctor.json
          python - "${{ matrix.platform }}" <<'PY'
          import json
          import sys
          result = json.load(open("doctor.json", encoding="utf-8"))["platforms"][sys.argv[1]]
          assert result["capabilities"]["skills"] == "ready"
          PY
          python scripts/install.py --platform "${{ matrix.platform }}" --uninstall

  release:
    needs: [validate, platform-contract]
    runs-on: ubuntu-24.04
    env:
      BLUE_SEC_CACHE: ${{ github.workspace }}/.ci-state/cache
      BLUE_SEC_CONFIG: ${{ github.workspace }}/.ci-state/config
      BLUE_SEC_DATA: ${{ github.workspace }}/.ci-state/data
      CODEX_HOME: ${{ github.workspace }}/.ci-state/codex-home
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: "1"
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Build release archives
        run: >-
          python scripts/release.py
          --tag "$RELEASE_TAG"
          --artifact-only
          --out dist

      - name: Publish GitHub Release
        run: >-
          gh release create "$RELEASE_TAG"
          dist/blue-sec-hub-*.tar.gz
          dist/blue-sec-hub-*.zip
          dist/SHA256SUMS
          --verify-tag
          --title "Blue Sec Hub $RELEASE_TAG"
          --notes "Installable source release. Source validation and nine-platform contracts passed; live Codex/Claude Web/API/SPA behavioral certification is not claimed for this release."
